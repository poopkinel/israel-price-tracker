name: save discounted pages to the Wayback Machine

on:
  schedule:
    - cron: "30 2 * * *"    # after the daily collection
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      max_saves:
        description: "Max pages to submit in this run"
        required: false
        default: "2500"

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest main, not the commit the run was queued on: today's log must be current
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Save pages
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          MAX_SAVES: ${{ github.event.inputs.max_saves || '4000' }}
          TIME_BUDGET_MIN: "300"
          ARCHIVE_LOG_DIR: ${{ runner.temp }}/archive-log
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "price-tracker-bot@users.noreply.github.com"
          ( while sleep 900; do tracker/sync_archive_log.sh || true; done ) &
          LOOP=$!
          python -m tracker.archive || STATUS=$?
          kill $LOOP 2>/dev/null; sleep 2
          tracker/sync_archive_log.sh
          exit ${STATUS:-0}
      - name: Final log sync
        if: always()
        env:
          ARCHIVE_LOG_DIR: ${{ runner.temp }}/archive-log
        run: tracker/sync_archive_log.sh
