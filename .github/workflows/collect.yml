name: collect prices (daily)

on:
  schedule:
    - cron: "15 0 * * *"   # 02:15 Israel time (winter), 03:15 (summer)
  push:
    branches: [main]
    paths: ["tracker/**", "stores.json", ".github/workflows/collect.yml"]
  workflow_dispatch:
    inputs:
      stores:
        description: "Store ids separated by spaces (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect
        run: python -m tracker.collect ${{ github.event.inputs.stores }}
      - name: Report
        if: always()
        run: python -m tracker.report
      - name: Commit data
        if: always()
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "price-tracker-bot@users.noreply.github.com"
          git add data REPORT.md
          git diff --cached --quiet && exit 0
          git commit -m "data: prices $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && exit 0; sleep 15; done
          exit 1
